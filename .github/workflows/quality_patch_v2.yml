name: One-time quality upgrade v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quality_patch_v2.yml
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply quality fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"Missing anchor in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # Train a global baseline whenever fixture-driven team training is active.
          # This does not cap teams; it adds a full-history anchor to every fixture team.
          replace_once(
              "train.py",
              '''        if not focus_list:\n            log("ERROR: no valid focus teams")\n            sys.exit(1)\n\n    registry = {''',
              '''        if not focus_list:\n            log("ERROR: no valid focus teams")\n            sys.exit(1)\n\n    # Global anchor is trained alongside every fixture-driven team.\n    # TEAM COUNT REMAINS ENTIRELY FIXTURE-DRIVEN; this adds no cap.\n    if os.environ.get("TRAIN_GLOBAL", "1").strip().lower() in ("1", "true", "yes"):\n        focus_list = [None] + [x for x in focus_list if x is not None]\n        log("Global baseline ENABLED alongside fixture-team models")\n\n    registry = {'''
          )

          # Make the simulator always combine the two team models with the global model.
          replace_once(
              "sim.py",
              '''    if runs:\n        return runs\n    g = MODELS_ROOT / "global"\n    if (g / "registry.json").exists() or (g / "models").is_dir():\n        return [(g, "global")]\n''',
              '''    g = MODELS_ROOT / "global"\n    if (g / "registry.json").exists() or (g / "models").is_dir():\n        if not any(str(d) == str(g) for d, _ in runs):\n            runs.append((g, "global"))\n    if runs:\n        return runs\n'''
          )

          # Temper entropy weighting: confidence alone must not let a peaky model dominate.
          replace_once(
              "sim.py",
              '''        conf = 1.0 / (0.35 + ent)  # sharper → higher weight\n        weights.append(conf * family_w.get(name, 1.0))''',
              '''        conf = 1.0 / (0.55 + ent)\n        weights.append(conf * family_w.get(name, 1.0))'''
          )

          # Give the global full-history run more stability weight than tiny team runs.
          replace_once(
              "sim.py",
              '''        weights.append(1.0 / (0.35 + ent))''',
              '''        reliability = 2.50 if label == "global" else 1.00\n        weights.append(reliability / (0.55 + ent))'''
          )

          # Do not call ordinary 62% model outputs secured locks. Require stronger
          # probability and agreement, and require multiple contributing engines.
          replace_once(
              "sim.py",
              '''        if is_dc(top):\n            locked = top["Model%"] >= 75 and abs(top["Model%"] - top["Sim%"]) <= 10\n        else:\n            locked = top["Model%"] >= 62 and abs(top["Model%"] - top["Sim%"]) <= 10\n        status = "SECURED LOCK" if locked else "STRONG LEAN"''',
              '''        engine_count = len([x for x in str(top.get("Agree", "")).split(",") if x.strip()])\n        if is_dc(top):\n            locked = top["Model%"] >= 80 and abs(top["Model%"] - top["Sim%"]) <= 6 and engine_count >= 3\n        else:\n            locked = top["Model%"] >= 72 and abs(top["Model%"] - top["Sim%"]) <= 6 and engine_count >= 3\n        status = "SECURED LOCK" if locked else "STRONG LEAN"'''
          )

          # Increase hard-v2 default dispersion; daily workflow overrides these explicitly.
          replace_once(
              "hard_simulation.py",
              'hardness = {"attack_cv":0.13, "defense_cv":0.13, "shared_cv":0.07,',
              'hardness = {"attack_cv":0.18, "defense_cv":0.18, "shared_cv":0.10,'
          )

          # Keep fixture-driven team training uncapped and enable the global anchor daily.
          replace_once(
              ".github/workflows/daily_run.yaml",
              '          TRAIN_GLOBAL: "1"\n',
              '          TRAIN_GLOBAL: "1"\n          MAX_FIXTURES: "0"\n'
          )

          for f in ("train.py", "sim.py", "hard_simulation.py"):
              compile(Path(f).read_text(encoding="utf-8"), f, "exec")
          print("quality upgrade v2 syntax: OK")

      - name: Commit patch and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/quality_patch_v2.yml
          git add -A
          git diff --cached --quiet && { echo "No patch changes"; exit 0; }
          git commit -m "Strengthen global-team ensemble and lock calibration"
          git push origin HEAD:main
