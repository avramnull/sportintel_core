name: Daily pipeline — results → train → sim → Sim Lab

concurrency:
  group: daily-pipeline
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 18 * * *"   # ~19:00 WAT
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Git LFS files
        run: |
          git lfs install
          git lfs pull
          ls -lh master_football_data.parquet
          # fail fast if still a pointer
          if head -1 master_football_data.parquet | grep -q "git-lfs"; then
            echo "ERROR: parquet still LFS pointer"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas numpy pyarrow scikit-learn
          pip install xgboost lightgbm catboost || true
          # Neural nets required for daily train
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true
          pip install tensorflow || true

      - name: Run full daily pipeline
        env:
          FOOTBALL_SEASON: "2627"
          FOOTBALL_SEASON_LABEL: "2026/2027"
          MAX_TRAIN_TEAMS: "0"
          MIN_TEAM_MATCHES: "25"
          TODAY_ONLY: "1"
          DAILY_LIGHT: "1"
          USE_PYTORCH: "1"
          USE_TENSORFLOW: "1"
          USE_ADABOOST: "0"
          USE_RANDOM_FOREST: "1"
          MAX_BOOST_ROUNDS: "350"
          NN_EPOCHS: "15"
          DAILY_TARGETS: "ft_result,over25,btts,ht_result"
          TRAIN_WORKERS: "3"
          # empty TRAIN_DIVS = all leagues with fixtures today; set e.g. E0,SP1,D1,I1,F1 for top-only
          TRAIN_DIVS: ""
          N_SIMULATIONS: "3000"
          ODDS_BLEND: "0.40"
          SPORTINTEL_PUSH: "1"
          GITHUB_TOKEN: ${{ secrets.SPORTINTEL_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          SPORTINTEL_REPO: avramnull/sportintel
        run: python daily_pipeline.py

      - name: Commit core data + models
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git add daily_football_data/ master_football_data.parquet football_models/ .gitattributes || true
          if git diff --staged --quiet; then
            echo "No core changes to commit"
            exit 0
          fi
          git commit -m "Daily pipeline: $(date -u +%Y-%m-%d)"
          # Integrate remote then push (handles concurrent pushes / shallow history)
          if ! git pull --rebase origin main; then
            echo "Rebase failed — merging with ours for model artifacts"
            git rebase --abort 2>/dev/null || true
            git pull origin main --no-rebase --allow-unrelated-histories || true
            # Prefer this run's trained artifacts on conflict
            git checkout --ours football_models daily_football_data master_football_data.parquet 2>/dev/null || true
            git add daily_football_data/ master_football_data.parquet football_models/ .gitattributes || true
            git commit -m "Daily pipeline merge: $(date -u +%Y-%m-%d)" || true
          fi
          git push origin HEAD:main
