name: Daily pipeline — results → train → sim → Sim Lab

concurrency:
  group: daily-pipeline
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      skip_train:
        description: "Skip training (re-sim + publish only)"
        type: boolean
        default: false
      max_train_teams:
        description: "MAX_TRAIN_TEAMS (0 = unlimited; default 12)"
        type: string
        default: "12"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS files
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull
          test -f master_football_data.parquet
          if head -1 master_football_data.parquet 2>/dev/null | grep -q "git-lfs"; then
            echo "ERROR: parquet is still an LFS pointer"
            exit 1
          fi
          size=$(stat -c%s master_football_data.parquet)
          if [ "$size" -lt 2000000 ]; then
            echo "ERROR: parquet too small (${size} bytes)"
            exit 1
          fi
          echo "Parquet OK: ${size} bytes"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Health check
        run: python -m tools.smoke_test --quick

      - name: Run full daily pipeline
        env:
          MAX_TRAIN_TEAMS: ${{ github.event.inputs.max_train_teams || '12' }}
          MIN_TEAM_MATCHES: "25"
          TODAY_ONLY: "1"
          DAILY_LIGHT: "1"
          USE_PYTORCH: "1"
          USE_TENSORFLOW: "1"
          USE_ADABOOST: "0"
          USE_RANDOM_FOREST: "1"
          MAX_BOOST_ROUNDS: "900"
          NN_EPOCHS: "45"
          CAPACITY_STEPS: "2"
          DAILY_TARGETS: "ft_result,over25,btts,ht_result"
          TRAIN_WORKERS: "3"
          TRAIN_DIVS: ""
          N_SIMULATIONS: "3000"
          ODDS_BLEND: "0.30"
          SKIP_TRAIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_train == 'true' && '1' || '0' }}
          SPORTINTEL_PUSH: "1"
          AFRICA_SEGMENT: "1"
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_STANDINGS_KEY: ${{ secrets.API_FOOTBALL_STANDINGS_KEY }}
          SKIP_AFRICA_TRAIN: "0"
          SKIP_AFRICA_SIM: "0"
          AFRICA_FETCH_ODDS: "0"
          AFRICA_PRIOR_SHRINK: "0.22"
          STANDINGS_STRENGTH: "0.55"
          SKIP_STANDINGS: "1"
          STANDINGS_ALLOW_API: "0"
          ENABLE_LIVE_STANDINGS: "0"
          GITHUB_TOKEN: ${{ secrets.SPORTINTEL_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          SPORTINTEL_REPO: avramnull/sportintel
          LOG_LEVEL: INFO
        run: python daily_pipeline.py

      - name: Commit generated data and models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_football_data/ master_football_data.parquet football_models/ .gitattributes
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Daily pipeline: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
