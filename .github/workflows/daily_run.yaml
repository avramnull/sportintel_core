name: Daily pipeline — results → train → sim → Sim Lab

concurrency:
  group: daily-pipeline
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily_run.yaml"
      - "requirements.txt"
      - "industrial_sim_engine.py"
      - "hard_simulation.py"
      - "run_fixture_sims.py"
      - "sim.py"
      - "train.py"
      - "daily_pipeline.py"
      - "scan_fixture_teams.py"
      - "tools/**"
      - "africa/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      skip_train:
        description: "Skip training (re-sim + publish only)"
        type: boolean
        default: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS files
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull
          test -f master_football_data.parquet
          if head -1 master_football_data.parquet 2>/dev/null | grep -q "git-lfs"; then
            echo "ERROR: parquet is still an LFS pointer"
            exit 1
          fi
          size=$(stat -c%s master_football_data.parquet)
          if [ "$size" -lt 2000000 ]; then
            echo "ERROR: parquet too small (${size} bytes)"
            exit 1
          fi
          echo "Parquet OK: ${size} bytes"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.8"
          python -m pip install --no-cache-dir "xgboost-cpu>=3.2"
          python -m pip install --no-cache-dir -r requirements.txt
          python - <<'PY'
          import scipy, torch, xgboost, tensorflow as tf
          from hard_simulation import simulate_hard
          print("scipy:", scipy.__version__)
          print("torch:", torch.__version__, "cuda_available:", torch.cuda.is_available())
          print("xgboost:", xgboost.__version__)
          print("tensorflow:", tf.__version__)
          r = simulate_hard([.34,.32,.34],[.30,.40,.30],.50,.50,.30,1000,42)
          assert r["score_consistency"]["ht_leq_ft"] == 1.0
          assert sum(r["ft_sim"].values()) > .999
          print("hard-v2 compatibility smoke: OK", r["top3_ft"])
          PY

      - name: Normalize migration helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          p = Path("tools/finalize_provider_and_training_migration.py")
          if not p.exists():
              raise SystemExit("migration helper missing")
          s = p.read_text(encoding="utf-8")
          pat = re.compile(r"^(?P<indent>\s*)s = (?P<lit>'FDC_DIV_TO_LEAGUE = .*?') \\+ s$", re.M)
          m = pat.search(s)
          if m:
              mapping = ast.literal_eval(m.group("lit"))
              indent = m.group("indent")
              replacement = (
                  f'{indent}if "FDC_DIV_TO_LEAGUE = {{" not in s:\n'
                  f'{indent}    marker = "from __future__ import annotations\\n"\n'
                  f'{indent}    s = s.replace(marker, marker + "\\n" + {mapping!r} + "\\n", 1)'
              )
              s = s[:m.start()] + replacement + s[m.end():]
              p.write_text(s, encoding="utf-8")
              print("Migration helper normalized")
          else:
              print("Migration helper already normalized")
          PY

      - name: Finalize provider and training migration
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/finalize_provider_and_training_migration.py; then
            python tools/finalize_provider_and_training_migration.py
          else
            echo "Final migration already applied"
          fi

      - name: Restore committed Live-score client
        shell: bash
        run: |
          set -euo pipefail
          # The final migration validates source compatibility but must not
          # replace the hardened, quota-safe Live-score implementation.
          git checkout -- africa/live_score_api_fixtures.py africa/fetch_today_fixtures.py
          python -m py_compile africa/live_score_api_fixtures.py africa/fetch_today_fixtures.py
          echo "Committed Live-score client restored and compiled"

      - name: Normalize daily runtime
        shell: bash
        run: |
          set -euo pipefail
          python tools/normalize_daily_runtime.py
          python -m py_compile train.py africa/live_score_api_fixtures.py africa/fetch_today_fixtures.py

      - name: Industrial engine smoke test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from industrial_sim_engine import simulate_industrial
          r = simulate_industrial([.34,.33,.33],[.30,.40,.30],.50,.50,.30,12000,42)
          assert r["engine"]["version"] == "industrial-v3"
          assert r["score_consistency"]["ht_leq_ft"] == 1.0
          assert abs(sum(r["ft_sim"].values()) - 1.0) < 1e-6
          assert 0.0 < r["distribution_diagnostics"]["top1_mass"] < 0.20
          print("industrial-v3 smoke: OK", r["top3_ft"], r["distribution_diagnostics"])
          PY

      - name: Health check
        run: python -m tools.smoke_test --quick

      - name: Run full daily pipeline
        env:
          MAX_TRAIN_TEAMS: "0"
          MAX_FIXTURES: "0"
          MIN_TEAM_MATCHES: "25"
          TODAY_ONLY: "1"
          DAILY_LIGHT: "1"
          USE_PYTORCH: "1"
          USE_TENSORFLOW: "1"
          USE_ADABOOST: "0"
          USE_RANDOM_FOREST: "1"
          MAX_BOOST_ROUNDS: "1800"
          NN_EPOCHS: "70"
          CAPACITY_STEPS: "3"
          DAILY_TARGETS: "ft_result,over25,btts,ht_result"
          TRAIN_WORKERS: "3"
          N_SIMULATIONS: "120000"
          ODDS_BLEND: "0.30"
          HARD_SIM: "1"
          INDUSTRIAL_SIM: "1"
          HARD_ATTACK_CV: "0.18"
          HARD_DEFENSE_CV: "0.18"
          HARD_SHARED_CV: "0.10"
          TRAIN_GLOBAL: "0"
          SKIP_TRAIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_train == 'true' && '1' || '0' }}
          SPORTINTEL_PUSH: "1"
          AFRICA_SEGMENT: "1"
          AFRICA_OPTIONAL: "1"
          LIVE_SCORE_API_KEY: ${{ secrets.LIVE_SCORE_API_KEY }}
          LIVE_SCORE_API_SECRET: ${{ secrets.LIVE_SCORE_API_SECRET }}
          SKIP_AFRICA_TRAIN: "0"
          SKIP_AFRICA_SIM: "0"
          AFRICA_FETCH_ODDS: "0"
          AFRICA_PRIOR_SHRINK: "0.22"
          STANDINGS_STRENGTH: "0"
          SKIP_STANDINGS: "1"
          ENABLE_LIVE_STANDINGS: "0"
          GITHUB_TOKEN: ${{ secrets.SPORTINTEL_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          SPORTINTEL_REPO: avramnull/sportintel
          LOG_LEVEL: INFO
        run: python daily_pipeline.py

      - name: Commit generated data and models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A daily_football_data/ master_football_data.parquet football_models/ .gitattributes industrial_sim_engine.py train.py sim.py run_fixture_sims.py africa/ si_config.py local_standings.py standings_prior.py tools/
          if git diff --cached --quiet; then
            echo "No generated/source changes to commit"
            exit 0
          fi
          git commit -m "Daily pipeline: fixture-team training and Live-score provider"
          git push origin HEAD:main
