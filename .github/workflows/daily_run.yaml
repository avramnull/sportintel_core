name: Daily pipeline — results → train → sim → Sim Lab

on:
  schedule:
    - cron: "0 18 * * *"   # ~19:00 WAT
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas numpy pyarrow scikit-learn
          pip install xgboost lightgbm catboost || true
          # optional; DAILY_LIGHT skips these but keep available
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true

      - name: Run full daily pipeline
        env:
          FOOTBALL_SEASON: "2627"
          FOOTBALL_SEASON_LABEL: "2026/2027"
          MAX_TRAIN_TEAMS: "28"
          MIN_TEAM_MATCHES: "40"
          DAILY_LIGHT: "1"
          MAX_BOOST_ROUNDS: "800"
          N_SIMULATIONS: "8000"
          ODDS_BLEND: "0.30"
          SPORTINTEL_PUSH: "1"
          GITHUB_TOKEN: ${{ secrets.SPORTINTEL_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          SPORTINTEL_REPO: avramnull/sportintel
        run: python daily_pipeline.py

      - name: Commit core data + models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_football_data/ master_football_data.parquet football_models/ .gitattributes || true
          git diff --staged --quiet || git commit -m "Daily pipeline: $(date -u +%Y-%m-%d)"
          git push
