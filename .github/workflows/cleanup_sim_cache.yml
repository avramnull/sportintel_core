name: Cleanup duplicate simulator cache definitions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup_sim_cache.yml"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize simulator cache definitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("sim.py")
          text = p.read_text(encoding="utf-8")
          block = "\n".join([
              "_XGB_CACHE: Dict[str, Any] = {}",
              "_LGBM_CACHE: Dict[str, Any] = {}",
              "_CAT_CACHE: Dict[str, Any] = {}",
              "_SK_CACHE: Dict[str, Any] = {}",
              "_TORCH_CACHE: Dict[str, Any] = {}",
              "_TF_CACHE: Dict[str, Any] = {}",
          ])
          pattern = re.compile(re.escape(block) + r"(?:\n\s*)+" + re.escape(block))
          while pattern.search(text):
              text = pattern.sub(block, text, count=1)
          if text.count("_XGB_CACHE: Dict[str, Any] = {}") != 1:
              raise SystemExit("Expected exactly one _XGB_CACHE definition after cleanup")
          p.write_text(text, encoding="utf-8")
          PY
          python -m py_compile sim.py
          rm -rf __pycache__ tools/__pycache__
          echo "Simulator cache definitions normalized"

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sim.py
          rm -f .github/workflows/cleanup_sim_cache.yml
          git add -u .github/workflows/cleanup_sim_cache.yml
          if git diff --cached --quiet; then
            echo "No duplicate cache cleanup required"
            exit 0
          fi
          git commit -m "Normalize simulator cache definitions"
          git fetch origin main
          git reset --soft origin/main
          git commit -m "Normalize simulator cache definitions"
          git push origin HEAD:main
