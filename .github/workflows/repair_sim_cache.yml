name: Repair simulator backend caches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair_sim_cache.yml"
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate simulator caches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("sim.py")
          text = p.read_text(encoding="utf-8")
          names = (
              "_XGB_CACHE", "_LGBM_CACHE", "_CAT_CACHE",
              "_SK_CACHE", "_TORCH_CACHE", "_TF_CACHE",
          )
          missing = [
              name for name in names
              if not re.search(rf"(?m)^\\s*{re.escape(name)}\\s*:\\s*Dict\\[str, Any\\]\\s*=\\s*\\{{\\}}\\s*$", text)
          ]
          if missing:
              marker = "_PREPROC_CACHE: Dict[Any, Any] = {}"
              required = marker + "\n" + "\n".join([
                  "_XGB_CACHE: Dict[str, Any] = {}",
                  "_LGBM_CACHE: Dict[str, Any] = {}",
                  "_CAT_CACHE: Dict[str, Any] = {}",
                  "_SK_CACHE: Dict[str, Any] = {}",
                  "_TORCH_CACHE: Dict[str, Any] = {}",
                  "_TF_CACHE: Dict[str, Any] = {}",
              ])
              if marker not in text:
                  raise SystemExit("sim.py is missing _PREPROC_CACHE marker; refusing unsafe edit")
              text = text.replace(marker, required, 1)
              p.write_text(text, encoding="utf-8")
              print("Initialized:", ", ".join(missing))
          else:
              print("All simulator backend cache definitions already present")
          PY

          python -m py_compile sim.py
          rm -rf __pycache__ tools/__pycache__
          echo "Simulator cache source validation: OK"

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sim.py
          rm -f .github/workflows/repair_sim_cache.yml
          git add -u .github/workflows/repair_sim_cache.yml
          if git diff --cached --quiet; then
            echo "No simulator cache changes required"
            exit 0
          fi
          git commit -m "Fix simulator backend cache definitions"
          git fetch origin main
          git reset --soft origin/main
          git commit -m "Fix simulator backend cache definitions"
          git push origin HEAD:main
